<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Schreibtisch</title>
</head>
<script src="{{ url_for('static', filename='canvas.js') }}"></script>
<body>

{% if fehler %}
    <p>Zettelstore ist aktuell nicht erreichbar.
{{ fehler }}</p>
{% endif %}
<h1 class="headline">Hier stehen alle Zettel</h1>

<div class="header__search-container">
            <input type="text" id="search-bar" class="header__search-input" placeholder="Search resources..." autocomplete="off" />
            <span class="header__search-badge">Ctrl+K</span>
          </div>
<ul>
    {% for i in zettel %}
        <li id='{{ i.id }}'>{{ i.id }} +++ {{ i.titel }}</li>
    {% endfor %}
</ul>
</body>
</html>
